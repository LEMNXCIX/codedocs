[package]
name = "codedocs-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
codedocs-core = { path = "codedocs-core" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "DomTokenList", "DomRect", "ScrollToOptions"] }

[workspace]
members = ["codedocs-core", "src-tauri"]

# The frontend is a binary crate for the wasm32 target; keep it out of the way
# of `cargo test` on the host, which only cares about `codedocs-core`.
[profile.dev]
opt-level = 0

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Cargo.lock lives in the workspace root, which is the only member set
          # the frontend job needs, so that is what gets cached.
          workspaces: .

      - name: Install npm dependencies
        run: npm ci

      - name: Check frontend compiles for wasm32
        run: cargo check --target wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (codedocs-core)
        run: cargo clippy -p codedocs-core --all-targets -- -D warnings

      - name: Test (codedocs-core)
        run: cargo test -p codedocs-core

      # The Rust compiler cannot check `js_name = __codedocs_*` against the
      # JS bridges: a typo resolves to `undefined` and only throws when the
      # user presses that shortcut. This compares both sides.
      - name: Check the JS bridge contract
        run: npm run check:bridge

  tauri:
    name: Tauri backend (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev

      - name: Check backend compiles
        run: cargo check -p codedocs

      - name: Clippy (codedocs backend)
        run: cargo clippy -p codedocs --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check
[build]
target = "./index.html"

[watch]
# Generated output. Watching these would make every build retrigger itself,
# since the build writes them into a directory trunk is watching.
ignore = [
    "./src-tauri",
    "./styles.css",
    "./public/codemirror-bridge.js",
    "./public/live-preview.js",
    "./public/vendor/preview-bridge.js",
]

[serve]
port = 1425
open = false

# Hooks run cross-platform: the bare executable name resolves on Linux/macOS,
# and the `.cmd` shim on Windows. Using `.cmd` explicitly broke the build on
# every platform except Windows.
[[hooks]]
stage = "pre_build"
command = "npx"
command_arguments = ["tailwindcss", "-i", "./input.css", "-o", "./styles.css", "--minify"]

[[hooks]]
stage = "pre_build"
command = "npx"
command_arguments = ["esbuild", "js/codemirror-bridge.mjs", "--bundle", "--format=iife", "--target=es2020", "--outfile=public/codemirror-bridge.js", "--minify"]

[[hooks]]
stage = "pre_build"
command = "npx"
command_arguments = ["esbuild", "js/live-preview.mjs", "--bundle", "--format=iife", "--target=es2020", "--outfile=public/live-preview.js", "--minify"]

# Was missing entirely, which is why editing js/preview-bridge.mjs had no
# effect: the committed artifact was hand-edited and never rebuilt.
[[hooks]]
stage = "pre_build"
command = "npx"
command_arguments = ["esbuild", "js/preview-bridge.mjs", "--bundle", "--format=iife", "--target=es2020", "--outfile=public/vendor/preview-bridge.js", "--minify"]
